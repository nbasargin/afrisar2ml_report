[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "afrisar2ml_report"
version = "1.0.0"
dependencies = [
  "numpy~=2.3.1",
  "torch~=2.7.1",
  "torchmetrics>=1.7.4",
  "matplotlib>=3.10.3",
  "pandas>=2.3.1",
  "geopandas>=1.1.1",
  "rasterio>=1.4.3",
  "shapely>=2.1.1",
  "pillow>=11.3.0",
  "gdal>=3.13.3",
  "xarray>=2025.9.0",
  "rioxarray>=0.19.0",
  "zarr>=3.1.5",
  "pystac>=1.14.3",
  "cartopy>=0.25.0",
  "psutil>=7.0.0",
]
license = {text = "MIT"}
description = "AfriSAR-2-ML: Report"
authors = [
    {name = "Nikita Basargin", email = "nikita.basargin@dlr.de"},
    {name = "Roman Guliaev", email = "roman.guliaev@dlr.de"},
    {name = "Matteo Pardini", email = "matteo.pardini@dlr.de"},
]
readme = "README.md"
requires-python = ">=3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 120

[tool.ruff.format]
line-ending = "lf"
